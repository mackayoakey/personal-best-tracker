<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#14161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bests">
  <title>Personal Bests</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-v4-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon-v4.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Bests home">
      <img class="brand-logo" src="logo-flame.png" alt="" width="20" height="26">
      <span>Bests</span>
    </a>
    <button id="status" class="status" type="button" data-state="idle"></button>
    <div class="top-actions">
      <button id="add-btn" class="btn primary" type="button" aria-label="New Activity">＋</button>
      <button id="weekly-btn" class="btn ghost menu-btn" type="button" aria-label="Weekly summary">📊</button>
      <button id="menu-btn" class="btn ghost menu-btn" type="button" aria-label="Open menu">☰</button>
    </div>
  </header>

  <main id="view"></main>

  <dialog id="menu" class="menu" aria-label="Menu">
    <div class="menu-head">
      <strong>Menu</strong>
      <button class="btn ghost" type="button" data-close-menu aria-label="Close menu">✕</button>
    </div>
    <nav class="menu-list">
      <a href="#/records">Records</a>
      <a href="#/ideas">Ideas</a>
      <a href="#/versions">Version History</a>
      <button id="menu-settings" type="button">Sync Settings</button>
      <button id="menu-lock" type="button">Lock Now</button>
    </nav>
    <p class="sub menu-foot" id="menu-version"></p>
    <p class="sub menu-foot" id="menu-remember"></p>
  </dialog>

  <dialog id="dlg"></dialog>
  <dialog id="weekly" class="whatsnew" aria-label="Weekly summary"></dialog>
  <dialog id="whatsnew" class="whatsnew" aria-label="App updated"></dialog>
  <div id="lock" class="lock" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
